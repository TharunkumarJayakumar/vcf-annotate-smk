name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python tools
        run: pip install pytest "snakemake==9.23.0"
      - name: Install bcftools (for the no-container end-to-end test)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bcftools
      - name: Unit tests + DAG check
        run: bash tests/smoke.sh
      - name: End-to-end wrapper test
        run: bash tests/integration.sh
